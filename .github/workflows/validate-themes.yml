name: Validate themes

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-themes:
    name: Check theme properties
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate all themes
        run: python scripts/check-themes.py
