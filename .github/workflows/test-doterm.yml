name: Test Doterm

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    name: Doterm command and backup tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run isolated shell tests
        run: bash tests/test-doterm.sh
